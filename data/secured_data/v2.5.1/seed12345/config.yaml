    tau_gate: 0.05
    w_outside: 0.3
    lambda_a: 0.05
    lambda_s: 0.1
    lambda_sat: 1.0
    sat_excess_threshold: 2.0
    lambda_pretanh: 1.0
    z_target: 0.867
    vs_gated_pretanh: true
    vs_gate_tau: 0.05
    input_rate:
      enabled: false
      delta: 0.3
      weight: 4
      ramp_steps: 10000
    u_reg:
      enabled: false
      weight: 0.5
