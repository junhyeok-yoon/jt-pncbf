# exp_config.yaml — per-experiment hyperparameters. Deep-merged on top of base_config.yaml.
# Saved into data/<run_id>/config.yaml at run start as the effective configuration.

run:
  version: "v2.6.0"
  seed: 42                          # per-experiment seed; multi-seed iterates this
  framework: jt_pncbf               # jt_pncbf | oc_pncbf
  system: quadrotor_planar          # double_integrator | unicycle | quadrotor_planar  (v2.6.0: direct-input planar quadrotor)

env:
  goal_speed_radius: 0.30           # v2.3.0 DI run: canonical DI criterion 0.30 (was 0.50 carried from the
                                    # unicycle work); base_config is 0.30 and untouched
  bounds:
    unicycle:
      v_max: 2.5                    # Step 1: unicycle speed bound matching the DI kinematic scale
                                    # (same a_max=2.0, arena, dt); clamped (signed) in unicycle.wrap_state
    quadrotor_planar:               # v2.6.0 §4 pinned constants (theory note Def 2.1 is symbolic; no reference env)
      f_min: 0.0                    # asymmetric thrust box [f_min, f_max]; contains hover m*g=9.81
      f_max: 19.62                  # net vertical accel +/- g
      tau_max: 0.2                  # torque box [-tau_max, tau_max]; max alpha=20 rad/s^2
      v_max: 2.5                    # A3 velocity clamp ||v||<=v_max (shared DI scale)
      omega_max: 4.0                # attitude-rate clamp for wrap_state
  quadrotor_planar:                 # v2.6.0 §4: physical constants + IC set + h_star gain
    mass: 1.0
    inertia: 0.01
    gravity: 9.81
    v_init_max: 1.5                 # IC linear velocity ~ U(disk radius 1.5)
    omega_init_max: 1.0             # IC angular velocity ~ U[-1, 1]
    c_gain: 0.3                     # h_star gain c: M6/P1 fixed final=0.3 (largest admissible with mean
                                    # distortion <=0.25; degen_frac 0, median ||L_gV||=0.3). Was 0.5 (center).

lqr:                                # v2.6.0 nominal cascaded PD (A1: admissible (f_thr,tau)); NOT the filter
  quadrotor_planar:
    kp_pos: 1.0                     # outer position loop: a_des = -kp_pos*(p-goal) - kd_pos*v
    kd_pos: 2.0
    kp_att: 40.0                    # inner attitude loop: tau = J*(-kp_att*wrap(theta-theta_des) - kd_att*omega)
    kd_att: 8.0

training:
  jt:
    n_steps: 42000                  # match v2.0.1 SOTA budget (same as the Sobolev run)
    vs_warmup_steps: 2000
    K_V: 3
    K_pi: 1
    bptt_T: 30                      # v2.3.0 SOTA baseline horizon (reset after v2.4.0 close; bptt_T=60 collapse root-caused)
    schedule_n_steps: 42000         # match v2.0.1 SOTA schedule budget (UNCHANGED for the 80k extension)
    pi_init_ckpt: null              # v2.5.1 A2(a): policy warm-start (pi_state-only init); null => fresh run
    horizon_critic:                 # v2.5.1 A2(b): horizon-summary critic W (performance channel only)
      enabled: false                # false => bit-identical to baseline (critic_net=None, no W-step)
      gamma: 0.99                   # gamma_c for the n-step discounted stage-cost-to-go + the gamma_c^T tail
      n_step: 30                    # bootstrap horizon of the W regression rollout
      lr: 1.0e-3                    # AdamW lr for W (house weight_decay / grad_clip / tau_polyak reused)
      weight: 1.0                   # policy-loss tail weight: + weight * gamma_c^T * W(x_T)
  oc_pncbf:
    epochs: 1000
    grad_steps_per_epoch: 500
    horizon: 100

optim:
  lr_VS: 3.0e-4
  lr_pi: 1.0e-4
  weight_decay: 0.1                 # applied to all params; no exclusions
  grad_clip: 2.0
  batch_size_jt: 4096
  batch_size_oc: 65536
  tau_polyak: 0.005
  polyak_per_v_step: true
  tb_histogram_every: 200
  metrics_log_every: 200             # write training metrics.csv/TB scalars every N value steps

safety_channel:                    # v2.5.0 Stage B: source of the deployed CBF h_fn
  type: value                       # value (learned V-hat, default/parity) | maneuver (analytic V_M) | cpi (frozen learned certificate); non-default set via run_training(safety_channel=...)
  maneuver:                         # analytic maneuver-family barrier V_M (src/common/maneuver_value.py)
    J: 8                            # lateral horizons j=1..J both directions -> |M| = 1 + 2J = 17 (shift-closed)
    both_dirs: true
    gamma_m: 0.02                   # h_eff = V_M + gamma_m (G7-selected margin)
  # v2.5.1 CPI loop: frozen learned certificate V_hat (raw, gamma_margin 0.0). checkpoint = canonical
  # V_hat_{k-1} for iteration k (it1 = secured seed-42 iteration-0 best.pt). type stays 'value' by default
  # (value/maneuver tests unaffected); it<k> runs pass safety_channel='cpi'.
  checkpoint: data/secured_data/v2.5.1/certificate_chain/V_hat_2p/best.pt
  gamma_margin: 0.0

value_target:
  type: pncbf                       # pncbf | rpcbf
  rpcbf_H: 7
  rpcbf_beta: 20.0
  conditioning: task_stored         # task_stored | brake | learned_recovery | task_raw_lagged (v2.4.2 close: reverted to baseline carry; raw_lagged block present-inert)
  raw_lagged:                       # v2.4.2: conditioning = unfiltered, noise-free re-rolls of a Polyak-lagged task-policy copy pi_b
    T_b: 30                         # re-roll horizon (>= max stop steps; matches brake/recovery T_b)
    tau_b: 0.005                    # Polyak lag of pi_b toward the task policy after each policy step
  brake:                            # analytic per-axis brake base for pi_b (uses eps_v)
    eps_v: 0.05                     # velocity deadband taper (m/s)
    T_b: 30                         # brake rollout steps (>= max stop steps 25 at dt=0.05)
  recovery:                         # v2.4.0 Step 2: learned avoid-optimal recovery conditioning policy
    T_b: 30                         # conditioning + avoid-BPTT rollout steps
    beta: 20.0                      # softmax-over-time temperature for the avoid-only loss
    tau_b: 0.005                    # Polyak rate for pi_b_target
    K_b: 1                          # pi_b updates per macro step

schedules:
  gamma_disc: {horizon_init: 20.0, horizon_final: 100.0, lambda_floor: 0.05, f_warm: 0.10, f_phase1: 0.80, total_epochs: 1000}
  target_rhs: {init: 0.0, final: 0.9, f_warm: 0.10, f_phase1: 0.80}
  sigma:
    sigma_min: 0.3
    sigma_max: 2.0
    init: 0.5
    rho_target: 0.10
    beta_proj: 0.05                  # SOTA-config parity; unused (only beta_sigma/rho_target consumed)
    beta_sigma: 0.05
    alpha_dom: 1.0                   # SOTA-config parity; unused
  sigma_pi:
    init: 0.0
    decay_steps: 5000

collection:
  jt:
    collect_every: 100
    episodes_per_collect: 100
    v_label_episodes: 32
    buffer_cap: 1000000              # restored to 1M (D_V=1M) for the multi-seed 2k/1M confirmation (D_V-shrink axis done)
    policy_buffer_cap: 2000           # v2.3.0 axis: D_pi-only FIFO sliding window (5000->2000; D_V + precursor keep
                                      # buffer_cap). Unset or == buffer_cap => prior behavior (flag-off bit-identical).
  oc_pncbf:
    collect_size: 4096
    buffer_capacity: 32768

loss:
  value:
    lambda_R: 1.0
    lambda_A: 0.0
    lambda_C: 0.0
    lg_authority:               # v2.6.0 R2 epsilon_g (system-generic; quadrotor only). Replaces the
      weight: 5.0               # DI-hardcoded cbf_deriv. L = w*mean_{near B_0} ReLU(eps_g - ||L_g V_hat||)
      eps_g: 0.05               # 7x the v5 starved 0.0072; 1/6 of thrust floor c/m=0.3 (changes.md §4)
      n_samples: 256
    cbf_deriv:                  # v2.2.1 box-feasibility CBF-derivative aux term (value-side)
      weight: 0.0               # v2.2.2: L_feas OFF (gate path fully skipped; weight=0 parity proven exact)
      gamma_strict: 0.3         # gamma: strict-descent slack (0.05->0.3; fire on the safe-side boundary)
      d_lo: 0.02                # gate clearance lower bound (m)
      d_gate: 0.25              # gate clearance upper bound (m)
      s_lo: 0.6                 # gate inward-speed lower bound
      s_hi: 2.5                 # gate inward-speed upper bound (= v_max)
      lateral_frac: 0.5         # lateral velocity spread as fraction of inward speed
      states_per_step: null     # null -> use the value-step minibatch size (batch_size_jt_value)
      exclude_doomed: true      # drop unavoidable-collision (doomed) gate states
      h_band_lo: -0.3           # recoverable-boundary h-band lower bound (additional filter)
      h_band_hi: 0.1            # recoverable-boundary h-band upper bound
    sobolev:                    # v2.2.2 gated-Sobolev axis: localized velocity-gradient matching on V_S
      enabled: false            # axis DONE (gate preserved reach but velocity-only matching raised collision
                                # 0.0045->0.0200 -> cps 0.8239 < base 0.8607); OFF = injection base. See build-log.
      weight: 2.2               # set by smoke gradient-contribution: ||grad L_grad||/||grad L_R|| = 0.0456 at
                                # weight 1 -> 0.10/0.0456 = 2.2 for ~10% (gate zeroes most states + velocity-only
                                # -> ~100x smaller raw than plain Sobolev's 4.76, hence weight 2.2 vs 0.07)
      H: 25                     # rollout horizon (>= ~10*v_max kinematic stopping need)
      rollout_policy: lqr       # {lqr, policy_detached}; LQR = cheap 1st-order label
      gate:                     # smooth over-speed gate: match dh/dv ONLY where over-speed occurs (reach-preserving)
        enabled: true           # false -> reduces to plain global full-vector Sobolev (clean ablation)
        velocity_only: true     # restrict the matched gradient to velocity channels (the dh/dv weakness)
        s0: 1.0                 # inward-speed center; gate ramps across inward 0.5->2.0 (collisions at ~1.5-2.5)
        tau_s: 0.5              # inward-speed sigmoid width
        c0: 0.3                 # clearance center; gate ramps up as clearance falls below ~0.3 (collisions <0.06)
        tau_c: 0.15             # clearance sigmoid width
    precursor_injection:        # v2.2.2: inject collision-precursor states into the value MSE batch
      enabled: false            # v2.3.0 DI plain run: injection OFF (single axis = policy_buffer_cap; baseline DI SOTA 0.8568)
                                # (emits [x,y,theta,v]; theta inward, speed=|inward+lateral| capped at v_max).
                                # DI hyperparameters reused unchanged. Flag off reproduces the Step-1 baseline exactly.
      fraction: 0.10            # 10% of each value minibatch are injected precursors, 90% normal buffer draw
      d_lo: 0.1                 # clearance lower bound (m); widened 0.0->0.1 toward the recoverable boundary
      d_hi: 0.3                 # clearance upper bound (m); widened 0.2->0.3 (was ~99.6% doomed at [0,0.2])
      s_lo: 0.3                 # inward-speed lower bound (covers the sub-0.6 regime, unlike the L_feas gate)
      s_hi: 1.0                 # inward-speed upper bound
      lateral_frac: 0.5         # lateral velocity spread as fraction of inward speed
  policy:
    gamma_T: 0.99
    w_terminal: 30.0                # v2.6.0 credit-horizon axis: BPTT terminal-value weight. Adds
                                    # discount(=gamma_T^T)*w_terminal*||p_T-g|| to the rollout return
                                    # (03_train §4.4 has no terminal) so goal-closing beyond the ~1.5 s
                                    # window is credited, breaking the myopic-hover trap. 0.0 = off
                                    # (DI/unicycle parity); quadrotor sets it. PROTOCOL FOLLOW-UP: §4.4.
    detach_filter_coeffs: true      # v2.6.0 M6: ON to remove the filter-Jacobian BPTT gradient explosion (M5 grad_norm_pi max 178k) that drowned the terminal's credit; 03_train §7 (forward byte-identical, backward drops coeff state-dependence). Was false (v2.4.0 Step 5 audit C1 fix, default off for DI/unicycle).
    w_friction: 0.0                 # v2.5.0 Stage B-2: filter-friction weight w_friction*||u_safe-u_nom||^2 (0.0 = parity default; B-2 run sets 0.05 via --w-friction)
    w_deficit: 0.0                  # v2.4.1 Exp 2 (deficit LOSS off; obs channel is the axis) — Exp 1: control-deficit policy-feedback weight (0.0 = off; adaptive-calibrated, see build_log)
    deficit_cap: 4.0                # v2.4.1: norm cap (= 2*u_max) on the raw box-free deficit delta_u (bounds the alpha_unsafe=100 ask)
    deficit_form: "sq_cap"          # v2.4.1: "sq_cap" (squared, zero-grad above cap) | "huber" (bounded nonzero grad above cap)
    obs_deficit_feedback: false     # v2.4.1 Exp 2: feed delta_u_{t-1} as a policy input (dim +2); false = dim-19 baseline
    lambda_v: 0.01                  # task-cost velocity weight
    mu_u: 0.001                     # task-cost action weight
    tau_gate: 0.05
    w_outside: 0.3
    lambda_a: 0.05                  # action_norm
    lambda_s: 0.1                   # smoothness
    lambda_sat: 1.0                 # sat_excess (on pre-projection |a_phi|)
    sat_excess_threshold: [19.62, 0.2]   # v2.6.0 PER-CHANNEL [thrust, torque] = box bounds (was DI-scalar
                                    # 2.0 which penalized the ~10 hover thrust). In-box output -> penalty 0.
    lambda_pretanh: 1.0
    z_target: 1.0                   # v2.6.0 raised 0.867->1.0: clamp_tanh reaches the box at |z|=0.867, so
                                    # z_target>=0.867 leaves boundary-reaching (incl. deep-safe tilted-IC
                                    # attitude-righting) UNPENALIZED; L_pre only discourages deep-clamp runaway.
    vs_gated_pretanh: true
    vs_gate_tau: 0.05
    input_rate:                     # v2.2.2 input-rate (du) axis: FAILED across all forms -> OFF for the u_reg run
      enabled: false                # disabled; du-penalty attacked the symptom (chattering), not the over-speed cause
      delta: 0.3
      weight: 4
      ramp_steps: 10000
    u_reg:                          # v2.2.2 add-on: LQR-style R term on APPLIED control, L_u = mean_t ||u_safe||^2
      enabled: false                # AXIS REJECTED -> OFF (flag-off is bit-identical to the injection-only baseline).
      weight: 0.5                   # sweep result: 0.1 == baseline (R-term ~0.1%); 1.0 over-conservative
                                    # (reach/cps regress, stuck pinned 0.085); 0.5 best-of-three but n2000
                                    # true-best 0.8404 < injection-only 0.8607 / SOTA 0.8568, and over-speed
                                    # uncurbed (danger-entry inward 0.347 vs LQR 0.19). See u_reg_build.md.

labeling:
  k_A: 5
  m_phys: 0.1
  k_safe: 5
  delta_C: 0.1

halt:
  vs_grad_leak_threshold: 1.0e-9
  sigma_max_cycles: 5
  cps_floor: -0.5
  early_stop_patience: 0
  early_stop_min_delta: 0.002

filter:
  lg_reg_eps: 0.0                   # INERT with box_aware=true (box-aware enumerates the exact feasible region,
                                    # bypassing the base-projection blow-up -> smoke confirmed identical corrections
                                    # eps=0 vs 0.005 at ||L_g h||=0 states). Kept at 0; only goal_speed_radius changed.
  alpha_safe: 2.0
  alpha_unsafe: 100.0
  lookahead:
    enabled: false
    N: 0
    beta: 0.0
    delta: 0.1

eval:
  cadence: 1500                     # v2.3.0 DI run: in-loop eval + step_NNNNNN.pt cadence checkpoints every 1500 macro steps (n2000 re-selection)
  # NOTE: eval.full.n stays 500 here (base default) so the trainer's automated final eval finds the
  # secured_data n500 pool. N=2000 is the reporting standard but is run via the manual in-RAM eval path
  # (data/eval_pools/eval_full_di_n2000_seed23456.pkl), since run_full reads the read-only secured_data/pools.

cpi:
  labels:
    system: di
    dt_vm: 0.05                # certificate grid; T_stop = ceil(v_max/(u_max*dt_vm)) = 25
    n_scenes: 20000
    states_per_scene_uniform: 60
    states_per_scene_boundary: 40   # cap; filled from |V_raw| <= boundary_band candidates
    boundary_band: 0.15
    jitter_pos_sigma: 0.10
    jitter_vel_sigma: 0.20
    speed_dist: uniform_0_vmax # speed ~ U[0, v_max], direction ~ U(S^1); high-speed oversampling is deliberate
    master_seed: 42            # single master; all label randomness = SeedSequence(master_seed).spawn(4)
                               # in order [scene, state, oracle-subset, split]. No other seed constants.
    label_batch: 65536         # pinned (05_code §7 eval-conditions pin)
    oracle_subset:             # V_M17 ground-truth scorer, reference path
      n_uniform: 200000
      n_boundary: 200000
  split:
    by: scene
    fractions: [0.72, 0.08, 0.10, 0.10]   # train / val(early-stop) / calib / test
  value:
    n_vs: 1                    # single member; conservatism lives in tau + eps_q, not ensemble-min
    # trunk per 02_control §3.2: 3 x 256, Softplus(beta=20), raw linear head (no read-out clip used)
  train:
    tau_quantile: 0.9          # pinball level; penalizes optimism (V_hat < V) 9:1
    batch_size: 16384
    lr: 1.0e-3
    weight_decay: 1.0e-4
    grad_clip: 1.0
    max_epochs: 60
    early_stop_patience: 8     # on val pinball; calib/test never touch training or selection
    seeds: [42, 99, 12345]     # standing seed convention
  calib:
    alpha: [0.10, 0.05, 0.01]
    band: 0.125                # |V_hat| <= band, in h-units (= 2 * delta_grid)
    band_sensitivity: [0.0625, 0.25]   # reported, not registered
    report_both_tails: true    # (V - V_hat)_+ and (V_hat - V)_+
