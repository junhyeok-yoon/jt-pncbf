[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jt-pncbf"
version = "2.4.2"
description = "Observation-Conditioned PNCBF and Joint Training for safe navigation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.12,<2.13",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "proxsuite>=0.6",
    "osqp>=0.6",
    "cvxpy>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tensorboard>=2.16",
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
